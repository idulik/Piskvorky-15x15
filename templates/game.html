<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Piškvorky 20x20</title>
</head>

<body>

{% if winner %}
    <h2 class="winner">Vyhral: {{ winner }}</h2>
{% endif %}

<div class="board">
    {% for row in board %}
        <div class="row">
            {% for cell in row %}

                {% if cell == "X" %}
                    <div class="cell x">X</div>

                {% elif cell == "O" %}
                    <div class="cell o {% if last_ai_move and forloop.parentloop.counter0 == last_ai_move.0 and forloop.counter0 == last_ai_move.1 %}ai-move{% endif %}">
                        O
                    </div>

                {% else %}
                    <a href="/move/{{forloop.parentloop.counter0}}/{{forloop.counter0}}/"
                       class="cell empty"></a>
                {% endif %}

            {% endfor %}
        </div>
    {% endfor %}
</div>

<form method="post" action="{% url 'reset' %}?from=home">
        {% csrf_token %}
        <button type="submit">🔄 Reštart hry</button>
    </form>

<!-- ================= CSS ================= -->
<style>

body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;
}

/* TITLE */
.title {
    margin-top: 20px;
}

.turn {
    opacity: 0.8;
    margin-bottom: 10px;
}

/* BOARD */
.board {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin: 20px auto;
}

/* ROW */
.row {
    display: flex;
    justify-content: center;
    gap: 3px;
}

/* CELL */
.cell {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    font-weight: bold;
    font-size: 16px;
    transition: 0.15s;
    text-decoration: none;
    color: white;
}

/* empty */
.cell.empty {
    background: #1e293b;
}

.cell.empty:hover {
    background: #334155;
    transform: scale(1.1);
}

/* X */
.cell.x {
    background: #ef4444;
    animation: pop 0.2s ease-in-out;
}

/* O */
.cell.o {
    background: #3b82f6;
    animation: pop 0.2s ease-in-out;
}

/* AI MOVE */
.cell.ai-move {
    background: orange !important;
    animation: flash 0.5s ease-out;
}

/* WINNER */
.winner {
    color: #22c55e;
    margin-top: 10px;
}

/* BUTTON */
button {
    margin-top: 10px;
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

/* ANIMATIONS */
@keyframes pop {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}

@keyframes flash {
    0% {
        transform: scale(1.4);
        box-shadow: 0 0 15px orange;
    }
    100% {
        transform: scale(1);
        box-shadow: none;
    }
}

@media (max-width: 768px) {
    .cell {
        width: 24px;
        height: 24px;
    }
}

@media (max-width: 400px) {
    .cell {
        width: 18px;
        height: 18px;
    }
}

.cell {
    touch-action: manipulation;
}

</style>


</body>
</html>
