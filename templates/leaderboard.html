<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Piškvorky</title>
</head>

<body>

<h1>🏆 Leaderboard</h1>

<p class="subtitle">
    Rebríček najlepších hráčov podľa výhier a prehier
</p>

<table>
    <tr>
        <th>Meno</th>
        <th>Výhry</th>
        <th>Prehry</th>
        <th>Úspešnosť</th>
    </tr>

    {% for player in players %}
    <tr>
        <td>{{ player.user.username }}</td>
        <td>{{ player.wins }}</td>
        <td>{{ player.losses }}</td>
        <td>{{ player.win_rate }}%</td>
    </tr>
    {% endfor %}
</table>

<a href="{% url 'home' %}">
    <button>← Späť na hlavnú stránku</button>
</a>

</body>
</html>
