<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>

<body>

{% if messages %}
    {% for message in messages %}
        <div class="message">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<!--Hláška po registrácii je uvedená v súbore accounts/views.py-->

{% if not success %}

<div class="register-box">

    <h2>Registrácia</h2>

    <form method="post">
        {% csrf_token %}

        <div class="field">
            <label>Username:</label>
            {{ form.username }}
        </div>

        <div class="field">
            <label>E-mail:</label>
            {{ form.email }}
        </div>

        <div class="field">
            <label>Password:</label>
            {{ form.password1 }}
        </div>

        <div class="field">
            <label>Repeat password:</label>
            {{ form.password2 }}
        </div>

        <button type="submit">Vytvoriť účet</button>
    </form>

</div>

{% endif %}

<style>
    body {
        margin: 0;
        height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        font-family: Arial, sans-serif;

        background: #0f172a;
    }

    .register-box {
        width: 360px;
        padding: 30px;

        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(10px);

        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);

        color: white;
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
    }

    .field {
        margin-bottom: 12px;
    }

    label {
        display: block;
        margin-bottom: 4px;
        font-size: 14px;
    }

    input {
        width: 100%;
        padding: 10px;

        border: none;
        border-radius: 8px;

        outline: none;
    }

    button {
        width: 100%;
        padding: 10px;
        margin-top: 10px;

        border: none;
        border-radius: 8px;

        background: #00c6ff;
        color: white;
        font-weight: bold;

        cursor: pointer;
    }

    button:hover {
        background: #009edb;
    }

    .message {
    background: #22c55e;
    color: black;

    padding: 12px;
    margin-bottom: 15px;

    border-radius: 10px;

    font-weight: bold;
    text-align: center;
    }

</style>

</body>
</html>
