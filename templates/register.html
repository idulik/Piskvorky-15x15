<h2>Register</h2>

<form method="post">
    {% csrf_token %}

    <div>
        <label>Username</label>
        {{ form.username }}
    </div>

    <div>
        <label>Email</label>
        {{ form.email }}
    </div>

    <div>
        <label>Password</label>
        {{ form.password1 }}
    </div>

    <div>
        <label>Repeat password</label>
        {{ form.password2 }}
    </div>

    <button type="submit">Vytvoriť účet</button>
</form>
